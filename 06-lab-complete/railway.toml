# Set the service root to 06-lab-complete on Railway.
# Set AGENT_API_KEY and REDIS_URL in the platform's service variables.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
